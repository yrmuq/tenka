[package]
name = "tenka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tenka-core = { path = "../tenka-core" }
ureq = { version = "3", default-features = false, features = ["json", "platform-verifier", "rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = "0.7.3"
url = "2"
zbus = "5"
