[package]
name = "tenka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ctrlc = "3"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
rfd = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tenka-core = { path = "../tenka-core" }
time = "0.3"
ureq = { version = "3", default-features = false, features = ["json", "platform-verifier", "rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2"
url = "2"
zbus = "6"
