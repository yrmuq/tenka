name: Build and check Tenka AppImage
description: Run workspace checks and smoke-test the x86_64 package on X11 and Wayland
inputs:
  channel:
    description: AppImage channel (stable, dev, or deps)
    required: true
  cache:
    description: Enable the shared Cargo cache for trusted branch builds
    default: "true"
runs:
  using: composite
  steps:
    - name: Install build dependencies
      id: toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake g++ libegl1 libgl1-mesa-dri libglx-mesa0 libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 weston xauth xdotool xvfb zsync
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        rustup default stable
        echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      if: inputs.cache == 'true'
      with:
        path: |
          ~/.cargo/registry
          target
        key: tenka-dev-ubuntu-2204-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', '.github/workflows/dev.yml') }}-${{ github.sha }}
        restore-keys: |
          tenka-dev-ubuntu-2204-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', '.github/workflows/dev.yml') }}-
          tenka-dev-ubuntu-2204-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
    - name: Verify workspace
      shell: bash
      run: |
        cargo fmt --all --check
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
    - name: Build AppImage
      shell: bash
      run: |
        cargo build --release --locked -p tenka
        TENKA_CHANNEL="${{ inputs.channel }}" ./packaging/build-appimage.sh
    - name: Open the AppImage on a virtual display
      shell: bash
      run: |
        xvfb-run -a bash -e -c '
          export LIBGL_ALWAYS_SOFTWARE=1
          ./dist/Tenka-x86_64.AppImage --appimage-extract-and-run &
          app=$!
          trap "kill $app 2>/dev/null || true" EXIT
          timeout 30 xdotool search --sync --onlyvisible --name "^Tenka$"
          kill -0 "$app"
        '
    - name: Open both AppImage windows over native Wayland
      shell: bash
      run: |
        xvfb-run -a bash -euo pipefail -c '
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=wayland-tenka
          export LIBGL_ALWAYS_SOFTWARE=1
          unset WAYLAND_SOCKET
          weston --backend=x11-backend.so --socket="$WAYLAND_DISPLAY" --no-config --idle-time=0 \
            --width=1024 --height=768 --log="$XDG_RUNTIME_DIR/weston.log" &
          compositor=$!
          app=
          trap '"'"'if [[ -n "$app" ]]; then kill "$app" 2>/dev/null || true; fi
            kill "$compositor" 2>/dev/null || true
            rm -rf "$XDG_RUNTIME_DIR"'"'"' EXIT
          for attempt in {1..100}; do
            [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$XDG_RUNTIME_DIR/weston.log"
            exit 1
          fi
          for window in convert compare; do
            args=()
            if [[ "$window" == compare ]]; then args=(--compare en light); fi
            log="$XDG_RUNTIME_DIR/$window.log"
            env -u DISPLAY WAYLAND_DEBUG=client ./dist/Tenka-x86_64.AppImage \
              --appimage-extract-and-run "${args[@]}" >"$log" 2>&1 &
            app=$!
            for attempt in {1..100}; do
              if grep -qE "xdg_surface[@#][0-9]+\.ack_configure" "$log"; then break; fi
              if ! kill -0 "$app" 2>/dev/null; then break; fi
              sleep 0.1
            done
            if ! grep -qE "xdg_surface[@#][0-9]+\.ack_configure" "$log" || ! kill -0 "$app"; then
              cat "$XDG_RUNTIME_DIR/weston.log" "$log"
              exit 1
            fi
            kill "$app"
            wait "$app" || true
            app=
          done
        '
