name: Build and check Tenka AppImage
description: Run workspace checks and smoke-test the x86_64 package on X11 and Wayland
inputs:
  channel:
    description: AppImage channel (stable, dev, or deps)
    required: true
  cache:
    description: Enable the shared Cargo cache for trusted branch builds
    default: "true"
runs:
  using: composite
  steps:
    - name: Install build dependencies
      id: toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake g++ libegl1 libgl1-mesa-dri libglx-mesa0 libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 patchelf weston xauth xdotool xvfb zsync
        rustup toolchain install stable --profile minimal --component clippy,rustfmt
        rustup default stable
        echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      if: inputs.cache == 'true'
      with:
        path: |
          ~/.cargo/registry
          target
        key: tenka-dev-ubuntu-2404-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', '.github/workflows/dev.yml') }}-${{ github.sha }}
        restore-keys: |
          tenka-dev-ubuntu-2404-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', '.github/workflows/dev.yml') }}-
          tenka-dev-ubuntu-2404-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
    - name: Verify workspace
      shell: bash
      run: |
        cargo fmt --all --check
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
    - name: Build AppImage
      shell: bash
      run: |
        cargo build --release --locked -p tenka
        TENKA_CHANNEL="${{ inputs.channel }}" ./packaging/build-appimage.sh
    - name: Open the AppImage on X11 with its bundled keyboard libraries
      shell: bash
      run: |
        xvfb-run -a bash -euo pipefail -c '
          export LIBGL_ALWAYS_SOFTWARE=1
          unset WAYLAND_DISPLAY WAYLAND_SOCKET
          log="$(mktemp)"
          LD_DEBUG=libs ./dist/Tenka-x86_64.AppImage --appimage-extract-and-run >"$log" 2>&1 &
          app=$!
          trap '"'"'kill "$app" 2>/dev/null || true; rm -f "$log"'"'"' EXIT
          if ! timeout 30 xdotool search --sync --onlyvisible --name "^Tenka$" || ! kill -0 "$app"; then
            tail -80 "$log"
            exit 1
          fi
          for library in libxkbcommon-x11.so.0 libxkbcommon.so.0 libxcb-xkb.so.1; do
            if ! grep -F "calling init:" "$log" | grep -E "/usr/(bin/\.\./)?lib/" | grep -F "/$library"; then
              grep -F "$library" "$log"
              exit 1
            fi
          done
        '
    - name: Open both AppImage windows over native Wayland
      shell: bash
      run: |
        xvfb-run -a bash -euo pipefail -c '
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_DATA_HOME="$XDG_RUNTIME_DIR/data"
          export WAYLAND_DISPLAY=wayland-tenka
          export LIBGL_ALWAYS_SOFTWARE=1
          unset WAYLAND_SOCKET
          weston --backend=x11 --socket="$WAYLAND_DISPLAY" --no-config --idle-time=0 \
            --width=1024 --height=768 --log="$XDG_RUNTIME_DIR/weston.log" &
          compositor=$!
          app=
          trap '"'"'if [[ -n "$app" ]]; then kill "$app" 2>/dev/null || true; fi
            kill "$compositor" 2>/dev/null || true
            rm -rf "$XDG_RUNTIME_DIR"'"'"' EXIT
          for attempt in {1..100}; do
            [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$XDG_RUNTIME_DIR/weston.log"
            exit 1
          fi
          mkfifo "$XDG_RUNTIME_DIR/title"
          exec 9<>"$XDG_RUNTIME_DIR/title"
          for window in convert compare; do
            args=()
            if [[ "$window" == compare ]]; then
              args=(--compare en light)
              export TENKA_COMPARE_UPPERCASE_TITLE=1
            fi
            log="$XDG_RUNTIME_DIR/$window.log"
            env -u DISPLAY WAYLAND_DEBUG=client ./dist/Tenka-x86_64.AppImage \
              --appimage-extract-and-run "${args[@]}" <&9 >"$log" 2>&1 &
            app=$!
            for attempt in {1..100}; do
              if grep -qE "xdg_surface[@#][0-9]+\.ack_configure" "$log"; then break; fi
              if ! kill -0 "$app" 2>/dev/null; then break; fi
              sleep 0.1
            done
            if ! grep -qE "xdg_surface[@#][0-9]+\.ack_configure" "$log" || ! kill -0 "$app"; then
              cat "$XDG_RUNTIME_DIR/weston.log" "$log"
              exit 1
            fi
            grep -E "xdg_toplevel[@#][0-9]+\.set_app_id\(\"io\.github\.yrmuq\.tenka\"\)" "$log"
            if [[ "$window" == compare ]]; then
              grep -F "set_title(\"TENKA — Compare images\")" "$log"
              printf 0 >&9
              for attempt in {1..100}; do
                if grep -Fq "set_title(\"Tenka — Compare images\")" "$log"; then break; fi
                sleep 0.1
              done
              grep -F "set_title(\"Tenka — Compare images\")" "$log"
            fi
            kill "$app"
            wait "$app" || true
            app=
          done
          icon="$XDG_DATA_HOME/io.github.yrmuq.tenka/window-icon.png"
          grep -Fx "Icon=$icon" "$XDG_DATA_HOME/applications/io.github.yrmuq.tenka.desktop"
          cmp "$icon" assets/io.github.yrmuq.tenka.png
        '
