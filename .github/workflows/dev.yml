name: Development build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    concurrency:
      group: tenka-dev-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          channel: dev
      - uses: actions/upload-artifact@v7
        with:
          name: Tenka-x86_64-${{ github.sha }}
          path: |
            dist/Tenka-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tenka-dev-draft
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Tenka-x86_64-${{ github.sha }}
          path: dist
      - name: Verify and update the development draft
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer dev commit is already available."
            exit 0
          fi

          cd dist
          sha256sum --check SHA256SUMS
          tag=dev-draft
          notes="AppImage development build from $GITHUB_SHA."
          if gh release view "$tag" --json isDraft > draft.json 2>/dev/null; then
            test "$(jq -r '.isDraft' draft.json)" = true
            gh release edit "$tag" --target "$GITHUB_SHA" --notes "$notes" --draft
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Tenka development build" --notes "$notes"
          fi
          gh release upload "$tag" Tenka-x86_64.AppImage SHA256SUMS --clobber
          stale=$(gh release view "$tag" --json assets --jq '.assets[].name | select(. != "Tenka-x86_64.AppImage" and . != "SHA256SUMS")')
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then gh release delete-asset "$tag" "$name" --yes; fi
          done <<< "$stale"
          gh release view "$tag" --json isDraft,targetCommitish,assets > draft.json
          jq -e --arg sha "$GITHUB_SHA" '
            .isDraft and .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["Tenka-x86_64.AppImage", "SHA256SUMS"] | sort)
          ' draft.json
          mkdir verified
          gh release download "$tag" --dir verified --pattern Tenka-x86_64.AppImage --pattern SHA256SUMS
          (cd verified && sha256sum --check SHA256SUMS)
