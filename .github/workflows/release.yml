name: Stable release
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: tenka-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare version
        id: prepare
        run: bash packaging/release.sh prepare stable
      - uses: ./.github/actions/build
        if: steps.prepare.outputs.version != ''
        with:
          channel: stable
      - name: Publish and verify stable AppImage
        if: steps.prepare.outputs.version != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: bash packaging/release.sh publish stable "$VERSION"
      - name: Sync the released version to dev and refresh its draft
        if: steps.prepare.outputs.version != ''
        run: |
          bash packaging/release.sh sync dev
          gh workflow run dev.yml --ref dev
      - name: Sync main into deps
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash packaging/release.sh sync deps
